name: "GitContext: Living AI Codebase Memory"
description: "Living AI codebase memory & rules compiler for Cursor, Copilot, and Claude Code continuously synced from Git commits."
author: "OneOrbit"
branding:
  icon: "cpu"
  color: "purple"

inputs:
  file:
    description: "The rules file to maintain (default: .llmrules)"
    required: false
    default: ".llmrules"
  format:
    description: "Rule output format: auto, markdown, toon, ts, yaml (default: auto)"
    required: false
    default: "auto"
  github_token:
    description: "GitHub token for commenting on Pull Requests"
    required: false
    default: ${{ github.token }}
  api_key:
    description: "Optional Gemini or OpenAI API key for deep LLM synthesis"
    required: false

runs:
  using: "composite"
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Run GitContext Action via uv
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GEMINI_API_KEY: ${{ inputs.api_key }}
      run: |
        uv run --project "${{ github.action_path }}" git-context action --file "${{ inputs.file }}" --format "${{ inputs.format }}"
