name: "GitContext: Living AI Codebase Memory"
description: "Automatically updates .llmrules & .cursorrules from git commits so AI assistants (Cursor, Copilot, Claude Code) follow current conventions."
author: "GitContext"
branding:
  icon: "cpu"
  color: "purple"

inputs:
  file:
    description: "The rules file to maintain (default: .llmrules)"
    required: false
    default: ".llmrules"
  github_token:
    description: "GitHub token for commenting on Pull Requests"
    required: false
    default: ${{ github.token }}
  api_key:
    description: "Optional Gemini or OpenAI API key for deep LLM synthesis"
    required: false

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Run GitContext Action
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GEMINI_API_KEY: ${{ inputs.api_key }}
      run: |
        python3 -m pip install -q setuptools
        python3 -m pip install -q -e ${{ github.action_path }}
        git-context action --file "${{ inputs.file }}"
